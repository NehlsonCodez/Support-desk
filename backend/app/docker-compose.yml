
services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: support-desk-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_desk

    ports:
      - "5438:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: